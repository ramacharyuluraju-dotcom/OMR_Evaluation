name: Build Windows Executable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Silences the GitHub Node.js deprecation warning
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-2022 

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        # We install pyinstaller alongside Flet so the compiler engine is present
        pip install flet pyinstaller pandas opencv-python-headless pymupdf reportlab pyzbar

    - name: Build Executable with Flet
      run: |
        # Calling the standard Flet CLI now that PyInstaller is installed
        flet pack AMC_Exam_Suite.py --name "AMC_Exam_Suite" --hide-console

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AMC_Exam_Suite_Windows_App
        path: dist/AMC_Exam_Suite.exe
