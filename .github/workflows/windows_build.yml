name: Build Windows Executable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# This silences the GitHub Node.js 20 deprecation warning
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    # Explicitly call windows-2022 to avoid the redirect warning for now
    runs-on: windows-2022 

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        # We explicitly add 'pyinstaller' so Flet has the engine it needs to build the .exe
        pip install flet pyinstaller pandas opencv-python-headless pymupdf reportlab pyzbar

    - name: Build Executable with Flet
      run: |
        # Using 'python -m flet' prevents the "command not found" PATH crash on Windows
        python -m flet pack AMC_Exam_Suite.py --name "AMC_Exam_Suite" --hide-console

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AMC_Exam_Suite_Windows_App
        path: dist/AMC_Exam_Suite.exe
