name: Build Windows Executable

on:
  push:
    branches: [ "main" ] # Triggers automatically when you push to main
  workflow_dispatch:     # Allows you to trigger the build manually from the Actions tab

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Matches the Python version you used locally

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        # Installing all the specific libraries required by your AMC Exam Suite
        pip install flet pandas opencv-python-headless pymupdf reportlab pyzbar

    - name: Build Executable with Flet
      run: |
        # This compiles the app into a single standalone .exe file
        # It hides the background console window (--hide-console)
        flet pack AMC_Exam_Suite.py --name "AMC_Exam_Suite" --hide-console

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AMC_Exam_Suite_Windows_App
        path: dist/AMC_Exam_Suite.exe
